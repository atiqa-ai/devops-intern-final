name: DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start application
        run: |
          python hello.py > app.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"
          sleep 2

      - name: Test application metrics endpoint
        run: |
          curl --fail http://127.0.0.1:8000/metrics
          echo "Application metrics endpoint is working."

      - name: Stop application
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then
            kill "$APP_PID" || true
          fi

      - name: Show application logs
        if: always()
        run: cat app.log
